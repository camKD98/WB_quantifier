name: Build Executables

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install pyinstaller

    - name: Run tests
      run: python -m pytest tests/ -x -q

    - name: Build executable (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --windowed --onefile --name="WesternBlotQuantifier" wb_quantifier_advanced.py
        cd dist
        zip -r WesternBlotQuantifier-macOS.zip WesternBlotQuantifier.app
        
    - name: Build executable (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --windowed --onefile --name="WesternBlotQuantifier" wb_quantifier_advanced.py
        cd dist
        powershell Compress-Archive WesternBlotQuantifier.exe WesternBlotQuantifier-Windows.zip
        
    - name: Build executable (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --windowed --onefile --name="WesternBlotQuantifier" wb_quantifier_advanced.py
        cd dist
        zip WesternBlotQuantifier-Linux.zip WesternBlotQuantifier
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: executables-${{ matrix.os }}
        path: dist/*.zip
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
